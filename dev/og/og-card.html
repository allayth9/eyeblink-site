<script>

 else{const d=D[K];ph.style.backgroundImage=`url(bg/c-${K}.png)`;ph.style.backgroundSize='1200px auto';ph.style.backgroundPosition='center -120px';ph.style.backgroundRepeat='no-repeat';ar.textContent=d[0];la.textContent=d[1];ix.textContent=d[2]?d[2]+' / 04':'';logo.remove()}
