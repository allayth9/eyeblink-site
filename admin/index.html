<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script>if(/(^|\.)pages\.dev$|^www\./.test(location.hostname)&&!/--|^[0-9a-f]{8}\./.test(location.hostname))location.replace("https://eyeblinkstudio.com"+location.pathname+location.search+location.hash);</script>
<title>لوحة تحكم Eyeblink</title>
<script>try{var t=localStorage.getItem('eb-admin-theme');if(t==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#04061A">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eyeblink Admin">
<link rel="apple-touch-icon" href="/assets/img/admin-icon-180.png">
<link rel="icon" href="/assets/img/admin-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/admin.css?v=85d7d5a9">
<script src="/admin/sky.js?v=b3e0d0ab" defer></script>
<link rel="stylesheet" href="/admin/theme.css?v=e6ba3061">
</head>
<body>
<div id="login" class="login">
  <form class="card" id="loginForm">
    <img src="/assets/img/favicon.svg" alt="" width="56" height="56">
    <h1>لوحة تحكم Eyeblink</h1>
    <p class="muted">أدخل كلمة السر لتعديل الموقع.</p>
    <input type="text" name="username" value="Eyeblink admin" autocomplete="username" hidden aria-hidden="true">
    <label for="pw">كلمة السر</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="check" style="justify-content:center"><input type="checkbox" id="remember" checked> تذكّرني على هذا الجهاز (30 يوماً)</label>
    <button class="btn primary" type="submit">دخول</button>
    <p class="muted small" id="loginMsg"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="side" id="side">
    <div class="brand"><img src="/assets/img/favicon.svg" alt="" width="34" height="34"><b>EYEBLINK</b><span>لوحة التحكم</span></div>
    <nav id="tabs"></nav>
    <div class="mode" id="mode"></div>
    <button class="btn sm" id="logoutBtn" type="button">تسجيل الخروج</button>
  </aside>
  <main class="main">
    <header class="top">
      <button class="mnav" id="mnavBtn" type="button" aria-label="القائمة" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <h2 id="tabTitle"></h2>
      <button class="btn sm" type="button" data-cmdk title="بحث (Ctrl+K)">بحث <kbd>Ctrl K</kbd></button>
      <span class="topico" id="topIcons"></span>
      <button class="themeBtn" id="themeBtn" type="button" aria-label="نايت / لايت" title="نايت / لايت"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <span class="state" id="state">محفوظ</span>
      <a class="btn" id="previewBtn" href="/" target="_blank" rel="noopener">معاينة</a>
      <button class="btn primary" id="publishBtn" type="button">نشر التعديلات</button>
    </header>
    <div id="panel" class="panel"></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/content.js"></script>
<script src="/admin/js/01-core.js?v=eea8a8ca"></script>
<script src="/admin/js/02-orders.js?v=0c105aea"></script>
<script src="/admin/js/03-shell.js?v=8071c692"></script>
<script src="/admin/js/04-team.js?v=cf3b6468"></script>
<script src="/admin/js/05-support.js?v=276bbd8f"></script>
<script src="/admin/js/06-layout.js?v=70ec0f8f"></script>
<script src="/admin/js/07-tasks.js?v=7d68a41f"></script>
<script src="/admin/js/08-notify.js?v=827df4b4"></script>
<script src="/admin/js/09-billing.js?v=06e4f63a"></script>
<script src="/admin/js/10-reports.js?v=f94dc856"></script>
<script src="/admin/js/11-clients.js?v=3cd4194a"></script>
<script src="/admin/js/12-settings.js?v=2597e697"></script>
<script src="/admin/js/13-boot.js?v=37e2958d"></script>
</body>
</html>
